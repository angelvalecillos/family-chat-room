<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Crear cuenta</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container" style="max-width:640px">
      <div class="card">
        <h1>Crear cuenta</h1>

        <label for="email">Correo</label>
        <input id="email" type="email" placeholder="tu@correo.com" />

        <label for="nickname">Apodo (admin)</label>
        <input id="nickname" type="text" placeholder="Tu apodo" />

        <label for="familyName">Nombre de la familia</label>
        <input id="familyName" type="text" placeholder="Mi Familia" />

        <div class="grid grid-cols-2" style="margin-top:8px">
          <div>
            <label for="password">Contraseña</label>
            <input id="password" type="password" placeholder="••••••••" />
          </div>
          <div>
            <label for="password2">Confirmar contraseña</label>
            <input id="password2" type="password" placeholder="••••••••" />
          </div>
        </div>

        <div style="margin-top:12px; display:flex; gap:8px">
          <button id="registerBtn" class="btn">Registrarse</button>
          <a href="login.html" class="btn ghost">Volver al login</a>
        </div>
        <div id="error" class="error" style="margin-top:8px"></div>
      </div>
    </div>

    <script type="module" src="./register.js"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Iniciar Sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body{font-family:system-ui,sans-serif;background:#0f1220;color:#e7e7ea;display:flex;justify-content:center;align-items:center;min-height:100vh}
      .card{background:#1a1f35;padding:24px;border-radius:12px;width:360px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
      h1{margin-top:0}label{display:block;margin:12px 0 6px}
      input{width:100%;padding:10px;border-radius:8px;border:1px solid #333a5a;background:#0f1328;color:#e7e7ea}
      .row{display:flex;justify-content:space-between;margin-top:8px}
      button{width:100%;padding:10px;border-radius:8px;border:none;background:#6c5ce7;color:#fff;font-weight:600;cursor:pointer;margin-top:16px}
      a{color:#a3b3ff;text-decoration:none}.error{color:#ff7675;margin-top:8px;min-height:20px}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Bienvenido de nuevo</h1>
      <p>Inicia sesión para acceder a Family Chat.</p>
      <label for="identifier">Correo o Usuario</label>
      <input id="identifier" type="text" placeholder="usuario o m@example.com" />
      <div class="row">
        <label for="password">Contraseña</label>
        <a href="#" id="resetLink">¿Olvidaste tu contraseña?</a>
      </div>
      <input id="password" type="password" placeholder="••••••••" />
      <button id="loginBtn">Iniciar Sesión</button>
      <div class="error" id="error"></div>
      <p style="margin-top:12px">¿No tienes una cuenta? <a href="register.html">Regístrate</a></p>
    </div>
    <script type="module" src="./login.js"></script>
  </body>
</html>
